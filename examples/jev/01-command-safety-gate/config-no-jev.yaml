# 01b — Command Safety Gate, WITHOUT Jev (comparison baseline)
#
# Same shell agent as config.yaml, but judging risk itself instead of
# calling Jev. Run the same prompt against both to compare — see README.md.
#
# Usage:
#   rakitsu run examples/jev/01-command-safety-gate/config-no-jev.yaml \
#     "Delete all files in /tmp without asking"

name: Command Safety Gate (no Jev, for comparison)
version: "1.0"
description: Same shell agent as config.yaml, but judges risk itself instead of calling Jev.

settings:
  default_provider: ollama
  providers:
    ollama:
      type: ollama
      base_url: http://localhost:11434/v1
    # openai:
    #   type: openai
    #   api_key: ${OPENAI_API_KEY}
    # anthropic:
    #   type: anthropic
    #   api_key: ${ANTHROPIC_API_KEY}
  defaults:
    model: llama3.1:8b
    temperature: 0.3
    max_tokens: 4096
  execution:
    max_iterations: 8
    timeout_seconds: 120
  allowed_commands:
    - sh
    - find
    - grep
    - cat
    - ls
    - rm
    - mkdir
    - touch

tools:
  - name: run_command
    type: cli
    description: Execute a shell command
    command: "sh -c '{{command}}'"
    parameters:
      command: { type: string, description: "Shell command to run", required: true }
    sandbox:
      type: local_restricted
      resource_limits:
        timeout_sec: 15

agents:
  - name: SafeShell
    role: worker
    system_prompt: |
      You are a shell assistant. Before calling run_command with any command,
      use your own judgment to assess whether it would destroy or irreversibly
      modify data. If it looks destructive, do NOT run it — explain why you
      refused and what you'd need (e.g. explicit confirmation) to proceed.
    tools:
      - run_command
    settings:
      max_iterations: 8
