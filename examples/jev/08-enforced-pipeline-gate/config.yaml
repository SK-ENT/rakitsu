# 08 — Enforced Pipeline Gate (Jev)
#
# Every prior example in this directory treats Jev's verdict as a judgment
# aid: an agent is instructed to call it and act on the answer, but nothing
# stops the agent from ignoring that instruction or misreporting what Jev
# actually said (07's README says this plainly: "the Jev check is a
# judgment aid... not a hard runtime gate enforced by Rakitsu itself — an
# agent could still ignore it").
#
# This example closes that gap using rakitsu's own Pipeline mechanism.
# `require_tool_call` already mechanically verifies a step's agent invoked
# a named tool, instead of trusting the agent's self-report (see 03). That
# gate can go one step further: `output_json_path` +
# `min_value`/`max_value` check the tool's ACTUAL JSON response, not just
# that it was called. Here, "merge" only runs at all if BOTH the
# "security-check" and "correctness-check" steps' own Jev calls came back
# below the concern threshold — checked by rakitsu's pipeline code directly
# against Jev's real API response, not by trusting either agent's own text
# output.
#
# Two separate gated steps, not one combined question: an earlier version
# of this example asked a single compound noul ("safe to merge, with no
# security OR correctness concerns?"). Confirmed live that this loses
# real information — the same test case gave an opaque
# "0.03, not safe" from the compound question, versus
# security_concern=0.16 (correctly low) and correctness_concern=0.97
# (correctly high) from two atomic questions on the identical state. Split
# into two gated steps so the mechanical check is on each concern
# separately, and a failure clearly says WHICH concern failed — not just
# that something did. (`RequireToolCall` is one gate per pipeline step in
# rakitsu's current schema, so this is two small sequential steps rather
# than one step checking two values — the correct minimal fix without a
# bigger schema change.)
#
# Usage — safe finding (gate passes, both steps run):
#   export TYPESAFE_API_KEY=...
#   rakitsu run examples/jev/08-enforced-pipeline-gate/config.yaml \
#     "Change: renamed a private helper function for clarity, no behavior change." \
#     --trace
#
# Usage — unsafe finding (gate fails, pipeline aborts before "merge" runs):
#   rakitsu run examples/jev/08-enforced-pipeline-gate/config.yaml \
#     "Change: the /admin/reset-password endpoint does not verify the \
#      caller's session before issuing a new password, so any authenticated \
#      user can reset any other user's password." \
#     --trace
#
# Runs keyless against local Ollama by default (https://ollama.com):
#   ollama pull llama3.1:8b
# Prefer a cloud model? Uncomment a provider under settings.providers below.

name: Enforced Pipeline Gate
version: "1.0"
description: Two atomic Jev noul verdicts mechanically gate whether a later pipeline step is even allowed to run.

settings:
  default_provider: ollama
  providers:
    ollama:
      type: ollama
      base_url: http://localhost:11434/v1
    # openai:
    #   type: openai
    #   api_key: ${OPENAI_API_KEY}
    # anthropic:
    #   type: anthropic
    #   api_key: ${ANTHROPIC_API_KEY}
  defaults:
    model: llama3.1:8b
    temperature: 0.3
    max_tokens: 4096
  execution:
    max_iterations: 6
    timeout_seconds: 120

tools:
  - name: jev
    type: jev
    description: Ask TypeSafe AI's Jev model a single, atomic question about a proposed change.

skills:
  # Shared Jev usage rules — see examples/jev/01-command-safety-gate's
  # config.yaml comment for why, and examples/jev/_shared/jev-usage-skill.md
  # for the content.
  - name: jev-usage
    description: General rules for calling the jev tool correctly.
    tools: [jev]
    prompt_template: file:../_shared/jev-usage-skill.md

agents:
  - name: SecurityChecker
    role: worker
    system_prompt: |
      You check whether a described change introduces a security concern.
      Call jev exactly once with:
        state: the change description, verbatim
        questions:
          security_concern: { type: noul, instructions:
            "Does this change introduce a security vulnerability or
             weakness?" }

      Report Jev's probability and your own one-line read of it. Your
      report is informational only — the pipeline step itself decides
      pass/fail mechanically from Jev's actual response, not from what you
      write here.
    tools:
      - jev
    skills:
      - jev-usage
    settings:
      max_iterations: 2

  - name: CorrectnessChecker
    role: worker
    system_prompt: |
      You check whether a described change breaks existing functionality.
      Call jev exactly once with:
        state: the change description, verbatim
        questions:
          correctness_concern: { type: noul, instructions:
            "Does this change break existing functionality, fail to
             compile, or fail to run correctly?" }

      Report Jev's probability and your own one-line read of it. Your
      report is informational only — the pipeline step itself decides
      pass/fail mechanically from Jev's actual response, not from what you
      write here.
    tools:
      - jev
    skills:
      - jev-usage
    settings:
      max_iterations: 2

  - name: Merger
    role: worker
    system_prompt: |
      Both the security check and the correctness check already passed
      (this step only runs if they both did). Respond with exactly: Merged.
    settings:
      max_iterations: 1

orchestrator:
  name: GatedMergePipeline
  strategy: Pipeline
  provider: ollama
  model: llama3.1:8b
  agents: [SecurityChecker, CorrectnessChecker, Merger]
  pipeline:
    steps:
      - name: security-check
        agent: SecurityChecker
        task: Check whether the change described in the original request introduces a security concern.
        require_tool_call:
          tool: jev
          output_json_path: answers.security_concern.noul
          max_value: 0.5
      - name: correctness-check
        agent: CorrectnessChecker
        task: Check whether the change described in the original request breaks existing functionality.
        require_tool_call:
          tool: jev
          output_json_path: answers.correctness_concern.noul
          max_value: 0.5
      - name: merge
        agent: Merger
        task: Merge the change.
