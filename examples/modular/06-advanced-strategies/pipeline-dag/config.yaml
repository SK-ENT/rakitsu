# 06d — Pipeline DAG Dependencies (modular)
#
# Agents are auto-discovered from agents/ subdirectory.
# Steps with depends_on create a DAG — parallel execution where possible.
#
# Diamond pattern:   parse
#                   /     \
#          generate_api  generate_types   (parallel)
#                   \     /
#               generate_tests
#                     |
#                  validate
#
# Usage:
#   rakitsu run examples/modular/06-advanced-strategies/pipeline-dag/config.yaml "Generate a REST API from this OpenAPI spec"

name: Code Generation DAG
version: "1.0"
description: DAG pipeline — parallel code generation with dependency ordering.

settings:
  default_provider: openai
  providers:
    openai:
      type: openai
      api_key: ${OPENAI_API_KEY}
      reasoning_effort: none
  defaults:
    model: gpt-5.6-luna
    temperature: 0.3
    max_tokens: 4096

orchestrator:
  name: CodeGenPipeline
  strategy: Pipeline
  provider: openai
  model: gpt-5.6-luna
  agents: [SchemaParser, APIGenerator, TypeGenerator, TestGenerator, Validator]
  pipeline:
    steps:
      - name: parse
        agent: SchemaParser
        task: Parse the API specification.

      - name: generate_api
        agent: APIGenerator
        task: Generate API handlers from the schema.
        depends_on: [parse]

      - name: generate_types
        agent: TypeGenerator
        task: Generate type definitions from the schema.
        depends_on: [parse]

      - name: generate_tests
        agent: TestGenerator
        task: Generate tests for the API and types.
        depends_on: [generate_api, generate_types]

      - name: validate
        agent: Validator
        task: Validate consistency across all generated code.
        depends_on: [generate_tests]
