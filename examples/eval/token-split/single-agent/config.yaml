# Eval A — Single Agent (control arm for token-split comparison).
#
# SAME task, SAME tools, SAME model, SAME sampling as the multi-agent arm.
# The only difference is orchestration: here one agent does the whole audit;
# the sibling config splits the work across specialist workers.
#
# Run with:
#   rakitsu run examples/eval/token-split/single-agent/config.yaml \
#     "Audit this repository: summarize the Go backend (internal/) in one \
#      paragraph, then the Vue frontend (web/src/) in one paragraph." \
#     --no-hub --timeout 900
#
# See: examples/eval/token-split/README.md

name: Token-Split Eval — Single Agent
version: "1.0"
description: |
  Control arm. One agent handles both the Go backend audit and the Vue
  frontend audit in a single ReAct loop. Compared against multi-agent/
  which splits the same workload across 2 specialist workers.

settings:
  default_provider: litellm
  providers:
    litellm:
      type: litellm
      api_key: ${LITELLM_API_KEY:-not-needed}
      base_url: ${LITELLM_BASE_URL:-http://localhost:4000}
      default_model: your-model-alias
  defaults:
    model: your-model-alias
    temperature: 0.1
    top_p: 0.7
    frequency_penalty: 0.5
    presence_penalty: 0.3
    max_tokens: 4096
  execution:
    max_iterations: 20
    timeout_seconds: 900
  allowed_commands:
    - grep
    - wc

tools:
  - name: list_files
    type: fs
    operation: list
    description: "List files in a directory. Use for discovery."
    allowed_paths:
      - "."
    parameters:
      path: { type: string, description: "Directory path", required: true }

  - name: read_file
    type: fs
    operation: read
    description: "Read a file's full contents. Use only on small files."
    allowed_paths:
      - "."
    parameters:
      path: { type: string, description: "File path", required: true }

  - name: search
    type: cli
    description: |
      Fixed-string search in a file or dir, up to 30 matches with line numbers.
      Use this BEFORE read_file on anything >8KB.
    # pattern/path are passed as $1/$2 (not interpolated into the script
    # text) so a value containing shell metacharacters can't break out of
    # the quoting — see the safe `sh -c 'script' _ "$@"` idiom.
    command: "sh -c 'grep -rn -C 2 -m 30 -F -- \"$1\" \"$2\" || echo \"(no matches)\"' _ {{pattern}} {{path}}"
    parameters:
      pattern: { type: string, description: "Fixed string", required: true }
      path:    { type: string, description: "File or directory",  required: true }
    sandbox:
      type: local_restricted
      resource_limits:
        timeout_sec: 10

agents:
  - name: Auditor
    role: worker
    system_prompt: |
      You audit a Go + Vue monorepo end-to-end in one session.

      Process:
        1. list_files(path="internal") to see Go packages.
        2. For 2-3 of those packages, search(pattern="func ", path="internal/<pkg>")
           to sample exported functions. Do NOT read_file on anything >8KB.
        3. list_files(path="web/src/components") to see Vue component groups.
        4. For 2-3 of those groups, list_files or search to sample their contents.
        5. Produce markdown output with exactly this shape, nothing else:

           ## Go backend (internal/)
           <one paragraph, ~120 words>

           ## Vue frontend (web/src/)
           <one paragraph, ~120 words>

      Hard budget: at most 10 tool calls total. After that, STOP and produce
      the summary with whatever you have. A shorter partial answer beats
      infinite exploration.

      Never invent package or component names. Only cite what tools returned.
    tools:
      - list_files
      - read_file
      - search
    settings:
      context:
        strategy: auto
        max_tool_output: 4000
        fence_outputs: true
        context_budget_threshold: 0.6
        context_retrieval_threshold: 0.8
