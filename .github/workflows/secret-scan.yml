# Source-of-truth for SK-ENT/rakitsu's secret-scan workflow — ported there
# by hand as .github/workflows/secret-scan.yml, same as ci-public.yml and
# release-public.yml. Deliberately NOT under .github/workflows/: this repo
# has its own secret-scan.yml, and Actions would run both.
name: Secret scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Run credential/secret scan
        run: sh scripts/security-scan.sh
