# Builds the frontend, embeds it into the Go binary (internal/webui's
# //go:embed all:dist needs at least one file under dist/ to compile),
# then tests/vets/builds/verifies the binary.
name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - 'NOTICE'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - 'NOTICE'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.27.3'

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'

      - name: Install frontend deps
        run: cd web && npm ci

      - name: Audit npm dependencies
        run: cd web && npm audit --audit-level=high --omit=dev

      - name: Build frontend
        run: cd web && npm run build

      - name: Embed frontend
        run: |
          rm -rf internal/webui/dist
          mkdir -p internal/webui/dist
          cp -r web/dist/. internal/webui/dist/

      - name: Go tests
        run: go test ./...

      - name: Go vet
        run: go vet ./...

      - name: Build binary
        run: go build -o bin/rakitsu ./cmd/rakitsu

      - name: Verify binary
        run: ./bin/rakitsu --version
