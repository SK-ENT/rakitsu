<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1102" viewBox="0 0 720 1102" role="img" aria-labelledby="replay-title replay-desc">
<title id="replay-title">Replay the recorded clamp review at one event</title>
<desc id="replay-desc">Teaching illustration of Replay. Select the completed clamp review in Run Timeline and scrub to the Reviewer response. At this same recorded event the graph shows Reviewer complete and Test Writer waiting, and the recorded log describes the fix. Play or scrub ahead for the suggested boundary test. Playback does not resume live execution.</desc>
<g font-family="system-ui, sans-serif">
<rect width="720" height="1102" rx="20" fill="#121521"/>
<text x="32" y="44" fill="#a9b4ff" font-size="23" font-weight="700">RAKITSU / 03 / REPLAY</text><text x="32" y="96" fill="#f1f3ff" font-size="38" font-weight="700">Replay the Reviewer’s response</text><text x="32" y="138" fill="#b8c1db" font-size="26">Layouts → Replay / recorded playback</text><rect x="32" y="168" width="656" height="206" rx="16" fill="#1d2235" stroke="#3d4669" stroke-width="2"/><text x="56" y="208" fill="#9ce4cb" font-size="25">RUN TIMELINE / selected recording</text><text x="56" y="251" fill="#f1f3ff" font-size="30" font-weight="700">Clamp review · completed</text><text x="56" y="294" fill="#f1f3ff" font-size="26">Scrub to the Reviewer response</text><path d="M60 336H660" stroke="#64749a" stroke-width="6"/><path d="M60 336H350" stroke="#9ce4cb" stroke-width="6"/><circle cx="350" cy="336" r="13" fill="#9ce4cb"/><path d="M360 382v28m-7-7 7 7 7-7" fill="none" stroke="#64749a" stroke-width="3"/><rect x="32" y="418" width="656" height="262" rx="16" fill="#1d2235" stroke="#3d4669" stroke-width="2"/><text x="56" y="458" fill="#9ce4cb" font-size="25">GRAPH / at the selected event</text><rect x="56" y="484" width="608" height="66" rx="16" fill="#1d2235" stroke="#9ce4cb" stroke-width="2"/><text x="80" y="526" fill="#9ce4cb" font-size="28">Reviewer / response complete</text><path d="M360 560v28m-7-7 7 7 7-7" fill="none" stroke="#64749a" stroke-width="3"/><rect x="56" y="602" width="608" height="50" rx="16" fill="#1d2235" stroke="#3d4669" stroke-width="2"/><text x="80" y="637" fill="#b8c1db" font-size="26">Test Writer / waiting at this point</text><rect x="32" y="712" width="656" height="180" rx="16" fill="#1d2235" stroke="#9ce4cb" stroke-width="2"/><text x="56" y="752" fill="#9ce4cb" font-size="25">RECORDED LOG / same event</text><text x="56" y="796" fill="#f1f3ff" font-size="27">Reviewer · Swap min and max.</text><text x="56" y="844" fill="#f1f3ff" font-size="28" font-family="monospace">return max(lo, min(x, hi))</text><text x="32" y="940" fill="#f1f3ff" font-size="27">Play or scrub ahead to Test Writer</text><text x="32" y="982" fill="#9ce4cb" font-size="28" font-family="monospace">clamp(12, 0, 10) == 10</text><text x="32" y="1030" fill="#b8c1db" font-size="26">Playback follows the saved events.</text>
<text x="32" y="1076" fill="#b8c1db" font-size="23">Teaching illustration / Python clamp review</text>
</g>
