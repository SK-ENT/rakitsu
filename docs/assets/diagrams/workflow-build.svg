<svg xmlns="http://www.w3.org/2000/svg" width="720" height="976" viewBox="0 0 720 976" role="img" aria-labelledby="build-title build-desc">
<title id="build-title">Build a two-step clamp review</title>
<desc id="build-desc">Teaching illustration of Builder. The input returns min(lo, max(x, hi)). Reviewer is wired before Test Writer in a Pipeline. Reviewer should describe max(lo, min(x, hi)) as the fix. Test Writer should suggest clamp(12, 0, 10) equals 10.</desc>
<g font-family="system-ui, sans-serif">
<rect width="720" height="976" rx="20" fill="#121521"/>
<text x="32" y="44" fill="#a9b4ff" font-size="23" font-weight="700">RAKITSU / 01 / BUILD</text><text x="32" y="96" fill="#f1f3ff" font-size="38" font-weight="700">Build the review pipeline</text><text x="32" y="138" fill="#b8c1db" font-size="26">Builder / two sequential agent steps</text><rect x="32" y="168" width="120" height="44" rx="16" fill="#252b45" stroke="#a9b4ff" stroke-width="2"/><text x="48" y="198" fill="#a9b4ff" font-size="24">+ Add</text><text x="176" y="198" fill="#b8c1db" font-size="26">Agents + Pipeline group</text><rect x="32" y="236" width="656" height="152" rx="16" fill="#1d2235" stroke="#3d4669" stroke-width="2"/><text x="56" y="274" fill="#a9b4ff" font-size="25">COMPOSER / Python input</text><text x="56" y="318" fill="#f1f3ff" font-size="27" font-family="monospace">def clamp(x, lo, hi):</text><text x="56" y="360" fill="#f1f3ff" font-size="27" font-family="monospace">  return min(lo, max(x, hi))</text><path d="M360 396v28m-7-7 7 7 7-7" fill="none" stroke="#64749a" stroke-width="3"/><rect x="32" y="432" width="656" height="426" rx="16" fill="#1d2235" stroke="#3d4669" stroke-width="2"/><text x="56" y="474" fill="#a9b4ff" font-size="25">PIPELINE / ordered steps</text><rect x="56" y="500" width="608" height="136" rx="16" fill="#1d2235" stroke="#3d4669" stroke-width="2"/><text x="80" y="542" fill="#f1f3ff" font-size="32" font-weight="700">Reviewer</text><text x="80" y="584" fill="#f1f3ff" font-size="27">Describe the bug and fix.</text><text x="80" y="618" fill="#9ce4cb" font-size="25" font-family="monospace">Expected fix: max(lo, min(x, hi))</text><path d="M360 646v28m-7-7 7 7 7-7" fill="none" stroke="#64749a" stroke-width="3"/><rect x="56" y="688" width="608" height="140" rx="16" fill="#1d2235" stroke="#3d4669" stroke-width="2"/><text x="80" y="730" fill="#f1f3ff" font-size="32" font-weight="700">Test Writer</text><text x="80" y="772" fill="#f1f3ff" font-size="27">Suggest a regression test.</text><text x="80" y="808" fill="#9ce4cb" font-size="27" font-family="monospace">clamp(12, 0, 10) == 10</text><text x="32" y="904" fill="#b8c1db" font-size="25">Review outputs / no edit or test execution</text>
<text x="32" y="950" fill="#b8c1db" font-size="23">Teaching illustration / Python clamp review</text>
</g>
</svg>
