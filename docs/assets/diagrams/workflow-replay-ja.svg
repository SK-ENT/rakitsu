<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1102" viewBox="0 0 720 1102" role="img" aria-labelledby="replay-title replay-desc">
<title id="replay-title">記録した clamp レビューのイベントを再生</title>
<desc id="replay-desc">Replay の解説図。Run Timeline で完了した clamp レビューを選び、Reviewer の回答まで再生位置を動かします。同じ記録イベントの位置で、グラフは Reviewer の完了と Test Writer の待機を示し、記録済みログは修正方法を表示します。Play またはスライダーで先に進むと、境界値のテスト案を確認できます。再生は実行の再開ではありません。</desc>
<g font-family="system-ui, sans-serif">
<rect width="720" height="1102" rx="20" fill="#121521"/>
<text x="32" y="44" fill="#a9b4ff" font-size="23" font-weight="700">RAKITSU / 03 / 再生</text><text x="32" y="96" fill="#f1f3ff" font-size="38" font-weight="700">Reviewer の回答を再生</text><text x="32" y="138" fill="#b8c1db" font-size="26">Layouts → Replay / 記録を再生</text><rect x="32" y="168" width="656" height="206" rx="16" fill="#1d2235" stroke="#3d4669" stroke-width="2"/><text x="56" y="208" fill="#9ce4cb" font-size="25">Run Timeline / 選択した記録</text><text x="56" y="251" fill="#f1f3ff" font-size="30" font-weight="700">clamp レビュー · 完了</text><text x="56" y="294" fill="#f1f3ff" font-size="26">Reviewer の回答位置へ移動</text><path d="M60 336H660" stroke="#64749a" stroke-width="6"/><path d="M60 336H350" stroke="#9ce4cb" stroke-width="6"/><circle cx="350" cy="336" r="13" fill="#9ce4cb"/><path d="M360 382v28m-7-7 7 7 7-7" fill="none" stroke="#64749a" stroke-width="3"/><rect x="32" y="418" width="656" height="262" rx="16" fill="#1d2235" stroke="#3d4669" stroke-width="2"/><text x="56" y="458" fill="#9ce4cb" font-size="25">グラフ / 選択したイベントの時点</text><rect x="56" y="484" width="608" height="66" rx="16" fill="#1d2235" stroke="#9ce4cb" stroke-width="2"/><text x="80" y="526" fill="#9ce4cb" font-size="28">Reviewer / 回答完了</text><path d="M360 560v28m-7-7 7 7 7-7" fill="none" stroke="#64749a" stroke-width="3"/><rect x="56" y="602" width="608" height="50" rx="16" fill="#1d2235" stroke="#3d4669" stroke-width="2"/><text x="80" y="637" fill="#b8c1db" font-size="26">Test Writer / この時点では待機中</text><rect x="32" y="712" width="656" height="180" rx="16" fill="#1d2235" stroke="#9ce4cb" stroke-width="2"/><text x="56" y="752" fill="#9ce4cb" font-size="25">記録済みログ / 同じイベント</text><text x="56" y="796" fill="#f1f3ff" font-size="27">Reviewer · min と max を入れ替える。</text><text x="56" y="844" fill="#f1f3ff" font-size="28" font-family="monospace">return max(lo, min(x, hi))</text><text x="32" y="940" fill="#f1f3ff" font-size="27">Play またはスライダーで Test Writer へ</text><text x="32" y="982" fill="#9ce4cb" font-size="28" font-family="monospace">clamp(12, 0, 10) == 10</text><text x="32" y="1030" fill="#b8c1db" font-size="26">保存済みイベントに沿って再生。</text>
<text x="32" y="1076" fill="#b8c1db" font-size="23">解説図 / Python の clamp レビュー</text>
</g>
</svg>
