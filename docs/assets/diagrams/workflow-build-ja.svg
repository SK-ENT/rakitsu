<svg xmlns="http://www.w3.org/2000/svg" width="720" height="976" viewBox="0 0 720 976" role="img" aria-labelledby="build-title build-desc">
<title id="build-title">2ステップの clamp レビューを構築</title>
<desc id="build-desc">Builder の解説図。入力は min(lo, max(x, hi)) を返します。Pipeline グループ内では Reviewer、Test Writer の順に実行します。Reviewer は修正案 max(lo, min(x, hi)) を説明し、Test Writer は clamp(12, 0, 10) が 10 になることを確認するテストを提案します。</desc>
<g font-family="system-ui, sans-serif">
<rect width="720" height="976" rx="20" fill="#121521"/>
<text x="32" y="44" fill="#a9b4ff" font-size="23" font-weight="700">RAKITSU / 01 / 構築</text><text x="32" y="96" fill="#f1f3ff" font-size="38" font-weight="700">レビューパイプラインを構築</text><text x="32" y="138" fill="#b8c1db" font-size="26">Builder / 2つのエージェントを順に実行</text><rect x="32" y="168" width="120" height="44" rx="16" fill="#252b45" stroke="#a9b4ff" stroke-width="2"/><text x="48" y="198" fill="#a9b4ff" font-size="24">+ Add</text><text x="176" y="198" fill="#b8c1db" font-size="26">エージェント + Pipeline グループ</text><rect x="32" y="236" width="656" height="152" rx="16" fill="#1d2235" stroke="#3d4669" stroke-width="2"/><text x="56" y="274" fill="#a9b4ff" font-size="25">入力欄 / Python コード</text><text x="56" y="318" fill="#f1f3ff" font-size="27" font-family="monospace">def clamp(x, lo, hi):</text><text x="56" y="360" fill="#f1f3ff" font-size="27" font-family="monospace">  return min(lo, max(x, hi))</text><path d="M360 396v28m-7-7 7 7 7-7" fill="none" stroke="#64749a" stroke-width="3"/><rect x="32" y="432" width="656" height="426" rx="16" fill="#1d2235" stroke="#3d4669" stroke-width="2"/><text x="56" y="474" fill="#a9b4ff" font-size="25">Pipeline / 上から順に実行</text><rect x="56" y="500" width="608" height="136" rx="16" fill="#1d2235" stroke="#3d4669" stroke-width="2"/><text x="80" y="542" fill="#f1f3ff" font-size="32" font-weight="700">Reviewer</text><text x="80" y="584" fill="#f1f3ff" font-size="27">バグと修正方法を説明。</text><text x="80" y="618" fill="#9ce4cb" font-size="25" font-family="monospace">修正案: max(lo, min(x, hi))</text><path d="M360 646v28m-7-7 7 7 7-7" fill="none" stroke="#64749a" stroke-width="3"/><rect x="56" y="688" width="608" height="140" rx="16" fill="#1d2235" stroke="#3d4669" stroke-width="2"/><text x="80" y="730" fill="#f1f3ff" font-size="32" font-weight="700">Test Writer</text><text x="80" y="772" fill="#f1f3ff" font-size="27">回帰テストを提案。</text><text x="80" y="808" fill="#9ce4cb" font-size="27" font-family="monospace">clamp(12, 0, 10) == 10</text><text x="32" y="904" fill="#b8c1db" font-size="25">レビューの回答のみ / 編集・テスト実行はなし</text>
<text x="32" y="950" fill="#b8c1db" font-size="23">解説図 / Python の clamp レビュー</text>
</g>
</svg>
