<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1012" viewBox="0 0 720 1012" role="img" aria-labelledby="debug-title debug-desc">
<title id="debug-title">実行中の clamp レビューを Reviewer で停止</title>
<desc id="debug-desc">Debug レイアウトの解説図。ブレークポイントで Reviewer の思考処理の前に停止します。実行グラフは Reviewer を強調表示し、Test Writer は待機中です。ライブログを確認してから Resume を選びます。Reviewer はまだ修正案を出していません。Resume で実行を再開します。</desc>
<g font-family="system-ui, sans-serif">
<rect width="720" height="1012" rx="20" fill="#121521"/>
<text x="32" y="44" fill="#a9b4ff" font-size="23" font-weight="700">RAKITSU / 02 / デバッグ</text><text x="32" y="96" fill="#f1f3ff" font-size="38" font-weight="700">Reviewer で一時停止</text><text x="32" y="138" fill="#b8c1db" font-size="26">Layouts → Debug / 実行中のデバッグ</text><rect x="32" y="168" width="140" height="44" rx="16" fill="#252b45" stroke="#ffd18a" stroke-width="2"/><text x="48" y="198" fill="#ffd18a" font-size="24">Debug</text><text x="196" y="198" fill="#b8c1db" font-size="25">ブレークポイント設定時に表示</text><rect x="32" y="236" width="656" height="308" rx="16" fill="#1d2235" stroke="#3d4669" stroke-width="2"/><text x="56" y="274" fill="#ffd18a" font-size="25">実行グラフ / 現在、一時停止中</text><rect x="56" y="300" width="608" height="96" rx="16" fill="#1d2235" stroke="#ffd18a" stroke-width="2"/><circle cx="82" cy="333" r="7" fill="#ff999e"/><text x="104" y="342" fill="#f1f3ff" font-size="30" font-weight="700">Reviewer</text><text x="80" y="378" fill="#ffd18a" font-size="25">PAUSED / 思考処理の前</text><path d="M360 406v28m-7-7 7 7 7-7" fill="none" stroke="#64749a" stroke-width="3"/><rect x="56" y="448" width="608" height="66" rx="16" fill="#1d2235" stroke="#3d4669" stroke-width="2"/><text x="80" y="490" fill="#b8c1db" font-size="28">Test Writer / 待機中</text><rect x="32" y="576" width="656" height="210" rx="16" fill="#1d2235" stroke="#3d4669" stroke-width="2"/><text x="56" y="616" fill="#ffd18a" font-size="25">Run Log / ここまでのライブイベント</text><text x="56" y="660" fill="#f1f3ff" font-size="27">Reviewer がブレークポイントに到達。</text><text x="56" y="703" fill="#f1f3ff" font-size="27">Reviewer の思考処理は開始前。</text><text x="56" y="750" fill="#b8c1db" font-size="25">グラフとログはこの位置で停止。</text><rect x="32" y="818" width="150" height="44" rx="16" fill="#252b45" stroke="#9ce4cb" stroke-width="2"/><text x="48" y="848" fill="#9ce4cb" font-size="24">Resume</text><text x="206" y="848" fill="#f1f3ff" font-size="27">実行を再開。</text><text x="32" y="902" fill="#f1f3ff" font-size="27">続いて Reviewer が修正方法を説明。</text><text x="32" y="942" fill="#f1f3ff" font-size="27">Test Writer が境界値の確認を提案。</text>
<text x="32" y="986" fill="#b8c1db" font-size="23">解説図 / Python の clamp レビュー</text>
</g>
</svg>
