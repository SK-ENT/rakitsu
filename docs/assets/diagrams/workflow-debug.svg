<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1012" viewBox="0 0 720 1012" role="img" aria-labelledby="debug-title debug-desc">
<title id="debug-title">Pause the live clamp review at Reviewer</title>
<desc id="debug-desc">Teaching illustration of the Debug layout. A breakpoint pauses Reviewer before its thought. The execution graph highlights Reviewer while Test Writer waits. Inspect the live log before selecting Resume. Reviewer has not produced its fix yet. Resume continues execution.</desc>
<g font-family="system-ui, sans-serif">
<rect width="720" height="1012" rx="20" fill="#121521"/>
<text x="32" y="44" fill="#a9b4ff" font-size="23" font-weight="700">RAKITSU / 02 / DEBUG</text><text x="32" y="96" fill="#f1f3ff" font-size="38" font-weight="700">Pause at the Reviewer</text><text x="32" y="138" fill="#b8c1db" font-size="26">Layouts → Debug / live execution</text><rect x="32" y="168" width="140" height="44" rx="16" fill="#252b45" stroke="#ffd18a" stroke-width="2"/><text x="48" y="198" fill="#ffd18a" font-size="24">Debug</text><text x="196" y="198" fill="#b8c1db" font-size="25">Available with a breakpoint</text><rect x="32" y="236" width="656" height="308" rx="16" fill="#1d2235" stroke="#3d4669" stroke-width="2"/><text x="56" y="274" fill="#ffd18a" font-size="25">EXECUTION GRAPH / paused now</text><rect x="56" y="300" width="608" height="96" rx="16" fill="#1d2235" stroke="#ffd18a" stroke-width="2"/><circle cx="82" cy="333" r="7" fill="#ff999e"/><text x="104" y="342" fill="#f1f3ff" font-size="30" font-weight="700">Reviewer</text><text x="80" y="378" fill="#ffd18a" font-size="25">PAUSED / before thought</text><path d="M360 406v28m-7-7 7 7 7-7" fill="none" stroke="#64749a" stroke-width="3"/><rect x="56" y="448" width="608" height="66" rx="16" fill="#1d2235" stroke="#3d4669" stroke-width="2"/><text x="80" y="490" fill="#b8c1db" font-size="28">Test Writer / waiting</text><rect x="32" y="576" width="656" height="210" rx="16" fill="#1d2235" stroke="#3d4669" stroke-width="2"/><text x="56" y="616" fill="#ffd18a" font-size="25">RUN LOG / live events so far</text><text x="56" y="660" fill="#f1f3ff" font-size="27">Reviewer reached its breakpoint.</text><text x="56" y="703" fill="#f1f3ff" font-size="27">No Reviewer thought yet.</text><text x="56" y="750" fill="#b8c1db" font-size="25">Graph and log stop at this checkpoint.</text><rect x="32" y="818" width="150" height="44" rx="16" fill="#252b45" stroke="#9ce4cb" stroke-width="2"/><text x="48" y="848" fill="#9ce4cb" font-size="24">Resume</text><text x="206" y="848" fill="#f1f3ff" font-size="27">Continue the live run.</text><text x="32" y="902" fill="#f1f3ff" font-size="27">Then Reviewer describes the fix.</text><text x="32" y="942" fill="#f1f3ff" font-size="27">Test Writer suggests the boundary check.</text>
<text x="32" y="986" fill="#b8c1db" font-size="23">Teaching illustration / Python clamp review</text>
</g>
</svg>
