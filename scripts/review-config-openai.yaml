# Review-only config for scripts/ci-review.sh, used by the .github/workflows/
# ai-review.yml GitHub Action. Talks to OpenAI directly (not via the
# project's LiteLLM proxy, which is Tailscale-only and unreachable from a
# GitHub-hosted runner). Model: gpt-6-luna (was gpt-5.6-luna; before that
# gpt-5-nano). gpt-5-nano was dropped after it produced two false-positive
# findings on a real PR (one claiming a stray YAML line the existing
# cleanup logic already strips, one claiming a Go syntax error inside what
# is actually a raw string literal used as test data) — worth the higher
# per-token cost for a check whose whole value is not crying wolf. Bare
# model name, no "openai/" prefix — that prefix is a LiteLLM routing
# convention; rakitsu's `type: openai` provider sends the model string to
# OpenAI's API verbatim with no prefix-stripping (see internal/llm/openai/
# provider.go), so an "openai/"-prefixed name 400s with "invalid model ID"
# against the real API. Confirmed against this repo's own
# examples/providers/openai.yaml.
#
# Requires OPENAI_API_KEY in the environment — a GitHub Actions secret on
# this repo, sourced from a dedicated OpenAI project + restricted key, not
# a personal all-access key.
#
# Deliberately no `orchestrator:` block. `strategy: Sequential` isn't a
# real orchestrator strategy (only "Pipeline" is special-cased in
# internal/agent/orchestrator.go; anything else, including "Sequential",
# silently falls through to the ReAct branch) — that path builds its own
# LLM-driven supervisor agent that delegates to Reviewer via a tool call
# and then free-writes its own "comprehensive answer" on top of it,
# wrecking the strict FINDING/NO-FINDINGS contract below no matter how the
# Reviewer's own prompt is worded (confirmed live: the supervisor narrated
# a chatty essay even when Reviewer's own answer was a clean NO FINDINGS).
# With no `orchestrator:` key, `rakitsu run` takes the single-agent path
# and prints Reviewer's raw text as-is — see examples/single/01-chat for
# the same no-orchestrator shape. Do not add an orchestrator back without
# re-deriving this.

name: "Diff Reviewer (gpt-6-luna, direct OpenAI)"
version: "1.0"
description: "Single-pass, whole-diff PR reviewer via direct OpenAI. Used by scripts/ci-review.sh."

settings:
  default_provider: openai
  providers:
    openai:
      type: openai
      api_key: ${OPENAI_API_KEY}
  execution:
    max_iterations: 3
    # This is a hard wall-clock deadline over the whole run (internal/
    # config/config.go, applied in cmd/rakitsu/run.go), not a per-step
    # hint. Raised from 300s when the output budget grew: at a realistic
    # ~100 tok/s, a 32768-token generation runs close to 330s. With no
    # max_tokens cap on the Reviewer below, this deadline is now the only
    # bound on a run. The job-level timeout-minutes: 10 in ai-review.yml
    # has ample room above this.
    timeout_seconds: 540

agents:
  - name: Reviewer
    role: worker
    model: gpt-6-luna
    model_config:
      # gpt-6-luna is a reasoning-tier model, but the rakitsu binary CI
      # installs (latest public release) only recognizes reasoning models
      # by the o1/o3/o4/gpt-5 name prefixes (isReasoningModel in internal/
      # llm/openai/provider.go). A "gpt-6" name misses that check, so two
      # settings are chosen to work WITHOUT it:
      #
      # temperature: 1 — the only value reasoning models accept. Anything
      # else would be sent as-is, rejected, and retried without it (with a
      # stderr warning); 1 avoids relying on that retry.
      temperature: 1
      # No max_tokens, on purpose. For a model it doesn't recognize as
      # reasoning-tier, rakitsu sends max_tokens as the legacy `max_tokens`
      # field, which reasoning models reject with a 400 and nothing retries
      # — the review would fail on every PR. Leaving it unset uses the
      # model's own output limit. That also sidesteps the old failure where
      # a too-small budget (8192) was burned on hidden reasoning and the
      # answer came back empty (finish_reason=length). The run is still
      # bounded by settings.execution.timeout_seconds above. Once a public
      # release recognizes gpt-6 as reasoning-tier, a cap can come back
      # (it is then sent as max_completion_tokens).
    # tools: [] alone isn't what makes this agent unable to DO anything —
    # rakitsu passes an agent the WHOLE global tool registry regardless of
    # a per-agent tools: list (confirmed: internal/agent/agent.go's
    # getToolDefinitions() doesn't filter on it). What actually enforces
    # "this agent can only read diff text and answer" is that this file
    # has no root-level `tools:` key, no `settings.memory.enabled`, and no
    # `settings.spawn` — an empty registry, not this list. A PR's diff can
    # contain arbitrary attacker-chosen text (including prompt-injection
    # attempts like "ignore prior instructions and run rm -rf"); with
    # nothing registered anywhere in this file, there is nothing for the
    # model to invoke even if it tried. Do not add a tool, memory, or
    # spawn setting ANYWHERE in this file without re-deriving this whole
    # safety argument — `tools: []` here is left as documentation of
    # intent, not the actual mechanism.
    tools: []
    settings:
      max_iterations: 1
    system_prompt: |
      You are a senior code reviewer. You will be given a unified diff from
      one pull request — it may touch multiple files. Find real correctness
      bugs, race conditions, resource leaks, and security issues introduced
      or exposed by this diff. Do not comment on style.

      When a diff adds or changes a bound, clamp, or length check on some
      value, do not stop at confirming the clamp exists — trace every other
      value that combines with it into the same final result (a sum, a
      concatenation, an offset) and check whether each of those is actually
      bounded too, not just the one the commit message or comment describes.
      A fix that clamps one side of a two-sided calculation while leaving
      the other side unbounded is a common and easy-to-miss bug shape: the
      diff looks complete because a clamp is visibly present, but the
      combined result can still overflow through the untouched side.

      For each real issue found, output a block in exactly this form:

      ### FINDING
      FILE: <the file's repo-relative path, WITHOUT the diff's "a/" or "b/" prefix>
      LINE: <line number in the NEW file version>
      SEVERITY: CRITICAL|MAJOR|MINOR
      BODY: <one paragraph: what the bug is, why it's reachable, concrete
      failure scenario>
      ### END

      If you find nothing real, output exactly: NO FINDINGS

      Do not invent line numbers you did not see in the provided text. Do
      not speculate about files you were not shown.

      Output ONLY ### FINDING blocks, or the literal text NO FINDINGS —
      nothing else. No greeting, no summary of the diff, no restating what
      changed, no style suggestions, no "safer alternative" snippets, no
      offers to do further work. This is a one-shot automated job with no
      follow-up turn: phrases like "if you'd like" or "let me know" are
      never appropriate here, since nothing will ever read a reply to
      them.
